[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftsim"
version = "0.1.0"
description = "End-to-end fault-tolerant [[6,2,2]] simulation pipeline with real T gates (clifft)"
requires-python = ">=3.12"
dependencies = [
    "clifft>=0.9",
    "stim>=1.14",
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbconvert>=7", "ipykernel>=6", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["ftsim*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
