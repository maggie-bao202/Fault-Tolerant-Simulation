[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftsim"
version = "0.2.0"
description = "Pluggable fault-tolerant logical-circuit simulation on LightStim (H6 + more)"
requires-python = ">=3.12"
dependencies = [
    "lightstim",
    "stim>=1.15",
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbconvert>=7", "ipykernel>=6", "matplotlib>=3.8", "nbformat>=5"]
# PPM / Pauli-based-computation frontend (run_pipeline(..., frontend="ppm")).
# Only ftsim.ppm.catalyst_frontend imports these, and lazily.
ppm = ["pennylane>=0.45", "pennylane-catalyst>=0.15"]

[tool.uv.sources]
lightstim = { path = "../LightStim", editable = true }

[tool.setuptools.packages.find]
include = ["ftsim*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
